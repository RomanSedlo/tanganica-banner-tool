<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Banner template</title>
  <style>
    @font-face {
      font-family: Graphik;
      src: url(https://cdn.prod.website-files.com/66ccb4fbf212967dcd04d6fc/66d5f68ca1847539055dcba8_GraphikMedium.otf)format("opentype");
      font-weight: 500; font-style: normal; font-display: swap
    }
    @font-face {
      font-family: Graphik;
      src: url(https://cdn.prod.website-files.com/66ccb4fbf212967dcd04d6fc/66d5f6ba07cac216635d0094_GraphikLight.otf)format("opentype");
      font-weight: 300; font-style: normal; font-display: swap
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Graphik; }
    .banner {
      width: 1080px; height: 1080px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 60px;
      padding: 2em;
      background-color: #f2f6fa;
    }
    .headline {
      font-size: 60px; text-align: center; color: rgb(2, 54, 176);
    }
    .cta {
      font-size: 32px; padding: 16px 32px; color: white;
      border-radius: 8px;
      background-color: orangered;
    }
    .free { color: rgb(17, 162, 17)} /* Main Orange #df5500 */
  </style>
</head>

<body>
  <div class="banner">
    <img src="/images/tanganica_logo_new.svg" alt="logo">
    <div class="headline">{{headline}}</div>
    <p class="free">ZDARMA</p>
    <div class="cta">{{cta_text}}</div>
  </div>
</body>

</html>
