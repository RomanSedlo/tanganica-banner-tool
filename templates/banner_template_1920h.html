<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>banner template 1920h</title>
  <style>
    :root {
      --blue-main:   #00386c;
      --blue-bright: #259ed2;
      --blue-light:  #1a6fb5;
      --orange:      #df5500;
      --orange-light:#e79106;
      --bg:          #f4f5f7;
      --white:       #ffffff;

      --width:   1080px;
      --height:  1920px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--width);
      height: var(--height);
      overflow: hidden;
    }
    body {
      background: var(--bg);
      font-family: 'Graphik', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: stretch;
    }
    @font-face {
      font-family: 'Graphik'; font-weight: 500;
      src: url('https://cdn.prod.website-files.com/66ccb4fbf212967dcd04d6fc/66d5f68ca1847539055dcba8_GraphikMedium.otf') format('opentype');
    }
    @font-face {
      font-family: 'Graphik'; font-weight: 300;
      src: url('https://cdn.prod.website-files.com/66ccb4fbf212967dcd04d6fc/66d5f6ba07cac216635d0094_GraphikLight.otf') format('opentype');
    }

    .banner {
      width:  var(--width);
      height: var(--height);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 120px 80px;
      gap: 0;
      position: relative;
    }
    .logo {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 48px;
    }
    .logo img {
      height: 48px;
      object-fit: contain;
    }
    .badge-zdarma {
      display: none;
      background: var(--orange);
      color: var(--white);
      font-family: 'Graphik', sans-serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 36px 10px 36px;
      border-radius: 20px;
      margin-bottom: 2px;
    }
    .label-webinar {
      display: none;
      font-family: 'Graphik', sans-serif;
      font-weight: 300;
      font-size: 56px;
      color: var(--blue-main);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-align: center;
      text-decoration: underline;
    }
    .headline {
      font-family: 'Graphik', sans-serif;
      font-weight: 500;
      font-size: 84px;
      line-height: 1.1;
      text-align: center;
      background: linear-gradient(135deg, var(--blue-bright) 0%, var(--blue-main) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 960px;
    }
    .subheadline {
      display: none;
      font-family: 'Graphik', sans-serif;
      font-weight: 400;
      font-size: 36px;
      color: var(--blue-main);
      text-align: center;
      max-width: 840px;
      line-height: 1.25;
    }
    .image {
      width: 80%;
      height: auto;
    }
    .cta-button {
      display: inline-block;
      background: linear-gradient(-30deg, var(--orange) 0%, var(--orange-light) 100%);
      color: var(--white);
      font-family: 'Graphik', sans-serif;
      font-weight: 500;
      font-size: 48px;
      padding: 28px 56px;
      border-radius: 12px;
      text-align: center;
      max-width: 800px;
      margin-bottom: 1em;
    }
    .platforms {
      font-size: 48px;
      word-spacing: 64px;
    }

    .banner.type-normal .subheadline { display: block; }
    .banner.type-lead-magnet .badge-zdarma { display: inline-block; }
    .banner.type-webinar .label-webinar { display: block; }

  </style>
</head>
<body>

  <div class="banner type-normal"> <!-- type-normal -->

    <div class="logo">
      <img src="images/tanganica_logo.svg" alt="Tanganica">
    </div>

    <div class="badge-zdarma">{{badge}}</div>

    <div class="label-webinar">{{webinar_label}}</div>

    <div class="headline">{{headline}}</div>

    <div class="subheadline">{{subheadline}}</div>

    <img class="image" src="https://placehold.co/720" alt="banner image">

    <div class="cta-button">{{cta_text}}</div>

    <div class="platforms">Google-ads Meta Bing</div>

  </div>

</body>
</html>
