<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Creative Production</title>
    <link rel="shortcut icon" href="images/tanganica_symbol.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav><img src="./images/tanganica_logo.svg" alt="Tanganica logo"></nav>
    <h1>Self-Marketing Creative Automation Tool</h1>
    <form action="n8n..." method="POST">
        <div>
            <label for="banner_size">Format</label>
            <div id="banner_size" name="banner_size" class="size_input">
                <label><input type="radio" name="banner_size" value="1080x1080" checked> 1080 × 1080</label>
                <label><input type="radio" name="banner_size" value="1080x1920"> 1080 × 1920</label>
            </div>
        </div>

        <div>
            <label for="ad_type">Ad type</label>
            <select name="ad_type" id="ad_type" class="main_input">
                <option value="normal_ad">Normal Ad</option>
                <option value="lead_magnet">Lead Magnet</option>
                <option value="webinar">Webinář</option>
            </select>
        </div>

        <div>
            <label for="function">Campaign type</label>
            <select name="function" id="function" class="main_input">
                <optgroup label="Ads">
                    <option value="google_ads">Google Ads Automation</option>
                    <option value="facebook_ads">Facebook & Meta Ads Automation</option>
                    <option value="bing_ads">Bing Ads Automation</option>
                    <option value="ai_campaign_creation">AI Campaign Creation</option>
                    <option value="budget_splitting">Automatic Budget Splitting</option>
                    <option value="ai_product_attributes">AI Product Attributes</option>
                </optgroup>
                <optgroup label="Diagnostics">
                    <option value="conversion_funnel">Conversion Funnel Analysis</option>
                    <option value="performance_benchmarks">Performance Benchmarks</option>
                    <option value="seo_analysis">SEO Analysis</option>
                    <option value="competitor_analysis">Competitor Analysis</option>
                    <option value="product_conversion_rate">Product Conversion Rate</option>
                    <option value="website_monitoring">Website Monitoring</option>
                </optgroup>
                <optgroup label="Statistics">
                    <option value="campaign_performance">Campaign Performance</option>
                    <option value="order_sources">Order Sources Attribution</option>
                    <option value="traffic_analysis">Traffic Analysis</option>
                    <option value="product_performance">Product Performance</option>
                    <option value="category_performance">Category Performance</option>
                </optgroup>
                <optgroup label="AI Tools">
                    <option value="ai_product_videos">AI Product Videos</option>
                    <option value="blog_content">AI Blog Content</option>
                    <option value="social_media_content">AI Social Media Content</option>
                    <option value="ad_creation">AI Ad Creation</option>
                    <option value="ai_image_generation">AI Image Generation</option>
                    <option value="newsletter_content">AI Newsletter Content</option>
                </optgroup>
            </select>
        </div>

        <div>
            <label for="header_text">Headline</label>
            <input type="text" id="header_text" name="header_text" class="main_input"
                placeholder="Enhance your product photos with AI">
            <button type="button" id="btn-headline-improve" title="Improve current headline with AI." disabled>
                <span class="btn-text">💫 Improve</span>
                <span class="spinner" id="spinner-headline-improve"></span>
            </button>
            <button type="button" id="btn-headline-generate" title="Generate headline text with AI.">
                <span class="btn-text">✨ Generate</span>
                <span class="spinner" id="spinner-headline-generate"></span>
            </button>
        </div>

        <div>
            <label for="button_text">Button text</label>
            <input type="text" id="button_text" name="button_text" placeholder="Try for free" class="main_input">
            <button type="button" id="btn-cta-improve" title="Improve current button text with AI." disabled>
                <span class="btn-text">💫 Improve</span>
                <span class="spinner" id="spinner-cta-improve"></span>
            </button>
            <button type="button" id="btn-cta-generate" title="Generate button text with AI">
                <span class="btn-text">✨ Generate</span>
                <span class="spinner" id="spinner-cta-generate"></span>
            </button>
        </div>

        <div id="image-upload-wrap" style="display: none;">
            <label for="banner_image">Banner image</label>
            <input type="file" id="banner_image" accept="image/*" class="main_input">
        </div>

        <div>
            <label for="submit"></label>
            <button type="submit" title="Fill in all fields to continue">
                <span class="btn-text">Generate banners</span>
                <div class="loader" id="banner-loader"></div>
            </button>
        </div>

    </form>

    <div id="notes">
        <h2>Useful Information</h2>
        <p>AI generates based on all of your input — leave inputs empty to generate from scratch.</p>
        <p>Button text is recommended to be 2 - 3 words.</p>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
